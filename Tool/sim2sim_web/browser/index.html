<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenDoge Sim2Sim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#1b1b20;color:#c4c4cc;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:250px 1fr 310px;grid-template-rows:auto 1fr auto;height:100vh;gap:1px;background:#2a2a32}
.panel{background:#212128;padding:12px;overflow-y:auto}
.panel-title{font-size:11px;font-weight:600;color:#787880;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #32323a}

/* header */
#header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:5px 16px;background:#1e1e25;border-bottom:1px solid #32323a}
#header h1{font-size:15px;font-weight:600;color:#d4a76a;letter-spacing:0.3px}
.header-info{font-size:11px;color:#808088;display:flex;gap:14px;align-items:center}
#status{font-size:10px;padding:3px 10px;border-radius:10px;background:#282832;font-weight:500}
#status.online{background:#1a2822;color:#7cac94}
#status.offline{background:#2a1c1c;color:#c47c7c}
#load-indicator{font-size:10px;color:#6c6c74}

/* controls */
#controls .control-group{margin-bottom:12px}
#controls label{display:block;font-size:10px;color:#888890;margin-bottom:3px}
#controls select,#controls button{width:100%;padding:6px 8px;border-radius:3px;border:1px solid #383840;background:#282830;color:#c0c0c8;font-size:11px;cursor:pointer;transition:border-color .2s,background .2s}
#controls select:focus,#controls button:focus{outline:none;border-color:#c0843c}
#controls button{padding:7px;margin-top:4px;font-weight:500;letter-spacing:0.3px}
.btn-start{background:#2a382a!important;border-color:#3a4a3a!important;color:#90c090!important}
.btn-start:hover{background:#344434!important}
.btn-stop{background:#3a2222!important;border-color:#4a3232!important;color:#d09090!important}
.btn-stop:hover{background:#442c2c!important}
.btn-reset{background:#2a2a30!important;border-color:#3a3a42!important;color:#a0a0a8!important}
.btn-reset:hover{background:#34343c!important}
.model-nav{display:flex;gap:4px;margin-top:4px}
.model-nav button{flex:1;font-size:10px;padding:4px}
.slider-group{margin:7px 0}
.slider-group .val{float:right;font-size:10px;color:#bd9a60;font-weight:500}
.slider-group input[type=range]{width:100%;accent-color:#c0843c}
.hint{font-size:9px;color:#5c5c64;margin-top:3px}

/* viewer */
#viewer-panel{display:flex;align-items:center;justify-content:center;background:#151518;position:relative;overflow:hidden}
#viewer-canvas{width:100%;height:100%;display:block}
#viewer-placeholder{color:#4a4a52;font-size:12px;text-align:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#viewer-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;color:#404048;pointer-events:none}

/* metrics */
#metrics .metric-row{display:flex;justify-content:space-between;font-size:10px;padding:3px 0;border-bottom:1px solid #2a2a32}
#metrics .metric-label{color:#787880}
#metrics .metric-value{font-family:'JetBrains Mono','Fira Code',monospace;font-size:10px;color:#a0b0a0}
.chart-box{height:110px;margin:8px 0;position:relative}
.chart-box canvas{width:100%!important;height:100%!important}

/* comparison */
#comparison{grid-column:1/-1;max-height:150px;background:#212128}
#comp-table{width:100%;font-size:9px;border-collapse:collapse}
#comp-table th,#comp-table td{padding:3px 6px;text-align:right;border-bottom:1px solid #2a2a32}
#comp-table th:first-child,#comp-table td:first-child{text-align:left}
#comp-table th{color:#787880;font-weight:500}
</style>
</head>
<body>

<div id="app">

<!-- HEADER -->
<div id="header">
  <h1>OpenDoge Sim2Sim</h1>
  <div class="header-info">
    <span id="model-name">--</span>
    <span id="status" class="offline">● loading</span>
    <span id="load-indicator"></span>
  </div>
</div>

<!-- LEFT: CONTROLS -->
<div id="controls" class="panel">
  <div class="panel-title">Policy</div>
  <div class="control-group">
    <select id="model-select"></select>
    <div class="model-nav">
      <button id="btn-prev">◀ Prev</button>
      <button id="btn-next">Next ▶</button>
    </div>
    <div class="hint"><b>[ ]</b> prev/next &nbsp; <b>Space</b> pause &nbsp; <b>R</b> reset</div>
  </div>

  <div class="panel-title">Command Velocity</div>
  <div class="slider-group">
    <label>vx forward <span class="val" id="val-vx">0.00</span></label>
    <input type="range" id="slider-vx" min="-1.5" max="1.5" step="0.01" value="0">
  </div>
  <div class="slider-group">
    <label>vy lateral <span class="val" id="val-vy">0.00</span></label>
    <input type="range" id="slider-vy" min="-1.0" max="1.0" step="0.01" value="0">
  </div>
  <div class="slider-group">
    <label>ω yaw &nbsp;&nbsp;&nbsp;&nbsp;<span class="val" id="val-vyaw">0.00</span></label>
    <input type="range" id="slider-vyaw" min="-2.0" max="2.0" step="0.01" value="0">
  </div>

  <div class="panel-title">Simulation</div>
  <button id="btn-start" class="btn-start">▶ Start</button>
  <button id="btn-reset" class="btn-reset">↺ Reset</button>
</div>

<!-- CENTER: VIEWER -->
<div id="viewer-panel" class="panel">
  <canvas id="viewer-canvas"></canvas>
  <div id="viewer-placeholder">Loading …</div>
  <div id="viewer-hint" style="display:none">drag rotate &nbsp;·&nbsp; right-drag pan &nbsp;·&nbsp; scroll zoom &nbsp;·&nbsp; dblclick reset</div>
</div>

<!-- RIGHT: METRICS -->
<div id="metrics" class="panel">
  <div class="panel-title">Joint Positions</div>
  <div style="height:85px"><canvas id="chart-joints"></canvas></div>
  <div class="metric-row"><span class="metric-label">base height</span><span class="metric-value" id="m-base-z">--</span></div>
  <div class="metric-row"><span class="metric-label">lin vel</span><span class="metric-value" id="m-lin-vel">--</span></div>
  <div class="metric-row"><span class="metric-label">ang vel</span><span class="metric-value" id="m-ang-vel">--</span></div>
  <div class="metric-row"><span class="metric-label">contact</span><span class="metric-value" id="m-contact">--</span></div>
  <div class="metric-row"><span class="metric-label">step</span><span class="metric-value" id="m-step">--</span></div>

  <div class="panel-title" style="margin-top:8px">History</div>
  <div class="chart-box"><canvas id="chart-height"></canvas></div>
  <div class="chart-box"><canvas id="chart-vel"></canvas></div>
</div>

<!-- BOTTOM: COMPARISON -->
<div id="comparison" class="panel">
  <div class="panel-title">Training Metrics
    <button style="font-size:9px;padding:2px 8px;float:right;background:#282830;border:1px solid #383840;color:#909098;border-radius:3px;cursor:pointer" id="btn-refresh-comp">Refresh</button>
  </div>
  <div style="overflow-x:auto"><table id="comp-table"><thead></thead><tbody></tbody></table></div>
</div>

</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
